# Isolated finite-reserve prototype. No changes to the active balance profiles.
# Names describe movement; all six custom pieces are capturable and nonroyal.
[reserve-guards:chess]
customPiece1 = a:fW
customPiece2 = c:F
customPiece3 = d:W2
customPiece4 = e:K
customPiece5 = f:KmN
customPiece6 = g:K2

pieceToCharTable = -
twoBoards = false
pieceDrops = true
capturesToHand = false
mustDrop = false
dropChecks = true
dropRegionWhite = *1 *2 *3 *4
dropRegionBlack = *5 *6 *7 *8

# Six-point demonstration: White has two level-3 grants; Black has four
# grants costing 1 + 1 + 2 + 2. This is not a measured equal-strength setup.
startFen = rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR[FGacde] w KQkq - 0 1

# Optional policy comparison: deployment cannot itself give check.
[reserve-guards-no-check:reserve-guards]
dropChecks = false
