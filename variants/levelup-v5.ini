# Current piece upgrades. The levelup-knight variant preserves the version 03 rules.
[levelup-v5:chess]
customPiece1 = e:NmW
customPiece2 = f:NsD
customPiece3 = g:WD
customPiece4 = h:BmW
customPiece5 = i:BcfN
customPiece6 = j:BfbR
customPiece7 = t:QmN
customPiece8 = u:QN
customPiece9 = a:ifmHfmDfmWfceF
customPiece10 = c:ifmnDfeWfF
customPiece11 = d:mRceB
customPiece12 = o:RcFcAcNcD
customPiece13 = l:RimD
customPiece14 = m:RcpR
customPiece15 = s:QimNimCimZ
pieceToCharTable = PNBRQ.EFGHIJTUACDOLMSKpnbrq.efghijtuacdolmsk
# Standard and purple rooks retain their original castling rights. Modern
# engines accept this legacy spelling as a set; older single-type engines
# need the server's capability check before playing upgraded-rook games.
castlingRookPiece = rlmo
# Initial-only moves are available while a piece occupies its home two ranks.
doubleStepRegionWhite = *1 *2
doubleStepRegionBlack = *7 *8
# All pawn levels keep standard promotions. Irreversible moves reset the
# fifty-move counter; purple's reversible quiet rook moves count toward it.
# The e flag opts into native en passant rules. Orange's identical quiet and
# capture diagonals make an empty en passant target a quiet move, not a capture.
pawnTypes = pacd
promotionPieceTypes = nbrq
startFen = rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
