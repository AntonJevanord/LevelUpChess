# User design draft, 2026-10-25. Not loaded by the four-reference experiment.
# Its manual values and jumping sideways bishop are separate research choices.
[Levelup:chess]

#knight capture rook (level 3) x
customPiece18 = w:RcN
#camel knight (level 3) x
customPiece19 = x:NC
#sideways bishop (level 3) x
customPiece17 = y:BsNsWsD
#amazon (level 3) baseline powerlevel reference, do not change
customPiece20 = z:QN

pieceToCharTable = -
castlingRookPieces = wr

#manually set the material value to avoid stockfish making wrongfull estimates
#especially important with many capture-only or move-only moves (bellow is guestimation)
