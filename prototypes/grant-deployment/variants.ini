# Isolated deployment-policy probes. These do not replace live grant rules,
# change a research profile, or establish prices for the guards below.
[grant-rank-two:chess]
customPiece1 = a:fWmfF
customPiece2 = c:F
customPiece3 = d:WD
pieceToCharTable = -
twoBoards = false
pieceDrops = true
capturesToHand = false
mustDrop = false
dropChecks = false
dropRegionWhite = *2
dropRegionBlack = *7
startFen = rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR[ACDacd] w KQkq - 0 1

# Native mandatory-drop policy: once a legal second-rank deployment exists,
# spend that turn dropping before another ordinary move is allowed.
[grant-rank-two-mandatory:grant-rank-two]
mustDrop = true
startFen = rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR[Dd] w KQkq - 0 1

# Seirawan-style insertion consumes a reserve guard during the same turn as
# the development move. This prototype enables only original back-rank gates.
# IMPORTANT: dropChecks=false does not prevent a gated move from giving check.
[grant-development-gates:grant-rank-two]
gating = true
seirawanGating = true
pieceDrops = false
dropRegionWhite = *1
dropRegionBlack = *8
startFen = rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR[ACDacd] w KQBCDFGkqbcdfg - 0 1
